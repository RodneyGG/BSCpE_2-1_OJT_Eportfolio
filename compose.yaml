services:
  # ─────────────────────────────────────────────
  # Nginx Reverse Proxy Gateway
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - app-network

  # ─────────────────────────────────────────────
  # Next.js Frontend App
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: nextjs_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - app-network

  # ─────────────────────────────────────────────
  # Laravel Backend API
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: laravel_backend
    restart: unless-stopped
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${MYSQL_DATABASE:-eportfolio_db}
      - DB_USERNAME=${MYSQL_USER:-bscpe21}
      - DB_PASSWORD=${MYSQL_PASSWORD:-bscpe21}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OCTANE_SERVER=frankenphp
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - app-network

  # ─────────────────────────────────────────────
  # MySQL Database Server
  # ─────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-eportfolio_db}
      MYSQL_USER: ${MYSQL_USER:-bscpe21}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bscpe21}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - app-network

  # ─────────────────────────────────────────────
  # Redis Cache Server
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - app-network

volumes:
  mysql_data:
  redis_data:

networks:
  app-network:
    driver: bridge